<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GamerZone | Panel de Administración</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/botones.css">
    <link rel="stylesheet" href="css/formularios.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/footer.css">
  </head>
  <body>
    <header>
      <div class="logo">
            <a href="index.html">
                <img src="img/gamer zone1.jpg" alt="GamerZone Logo" class="logo-img">
            </a>
        </div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Ir a la Tienda</a></li>
          <li><a href="admin-productos.html" class="active">Productos</a></li>
        </ul>
      </nav>
      <div class="user-actions">
        <span>Administrador</span> |
        <a href="login.html">Cerrar Sesión</a>
      </div>
    </header>

    <main class="admin-container">
      <h2>Gestión de Productos</h2>

      <!-- FORMULARIO DE CREACIÓN Y EDICIÓN -->
      <div class="form-box admin-form-box">
        <h3 id="form-titulo">Agregar Nuevo Producto</h3>
        <form id="form-admin-producto" novalidate>
          <input type="hidden" id="prod-id" />

          <div class="form-row">
            <div class="form-group">
              <label for="prod-nombre">NOMBRE DEL JUEGO</label>
              <input type="text" id="prod-nombre" maxlength="100" />
              <span class="error-msg" id="error-prod-nombre"></span>
            </div>

            <div class="form-group">
              <label for="prod-plataforma">PLATAFORMA</label>
              <select id="prod-plataforma">
                <option value="">- Seleccione -</option>
                <option value="PlayStation 5">PlayStation 5</option>
                <option value="Xbox Series X">Xbox Series X</option>
                <option value="Nintendo Switch">Nintendo Switch</option>
                <option value="PC / Steam">PC / Steam</option>
              </select>
              <span class="error-msg" id="error-prod-plataforma"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prod-precio">PRECIO ($)</label>
              <input type="number" id="prod-precio" min="1" />
              <span class="error-msg" id="error-prod-precio"></span>
            </div>

            <div class="form-group">
              <label for="prod-imagen">URL DE LA IMAGEN</label>
              <input
                type="text"
                id="prod-imagen"
                placeholder="https://via.placeholder.com/250x180"
              />
              <span class="error-msg" id="error-prod-imagen"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="prod-descripcion">DESCRIPCIÓN</label>
            <textarea id="prod-descripcion" rows="3" maxlength="300"></textarea>
            <span class="error-msg" id="error-prod-descripcion"></span>
          </div>

          <div class="admin-btn-group">
            <button type="submit" class="btn-submit" id="btn-guardar-prod">
              Guardar Producto
            </button>
            <button
              type="button"
              class="btn-cancelar"
              id="btn-cancelar-prod"
              onclick="limpiarFormularioAdmin()"
              style="display: none"
            >
              Cancelar Edición
            </button>
          </div>
        </form>
      </div>

      <!-- TABLA DE PRODUCTOS -->
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Imagen</th>
              <th>Nombre</th>
              <th>Plataforma</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos-body">
            <!-- Se renderiza desde JS -->
          </tbody>
        </table>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <div class="footer-logo">GamerZone Panel</div>
      </div>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
