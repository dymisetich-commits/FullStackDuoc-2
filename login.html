<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerZone | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="img/logo.png" alt="GamerZone Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html" class="active">Iniciar sesión</a> | 
            <a href="registro.html">Registrar usuario</a>
            <a href="carrito.html" class="cart-icon">🛒 Cart (<span id="cart-count">0</span>)</a>
        </div>
    </header>

    <main class="form-container">
        <div class="form-box">
            <div class="form-header">
                <h2>Iniciar Sesión</h2>
                <h3>Accede a tu cuenta de GamerZone</h3>
            </div>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="ejemplo@correo.com">
                    <span class="error-msg" id="error-login-email"></span>
                </div>

                <div class="form-group">
                    <label for="login-pass">Contraseña</label>
                    <input type="password" id="login-pass" placeholder="Ingresa tu contraseña">
                    <span class="error-msg" id="error-login-pass"></span>
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">GamerZone</div>
        </div>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
